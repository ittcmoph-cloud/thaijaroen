name: Worker tests

on:
  push:
    branches:
      - feature/remove-appscript-backend
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run compatibility tests
        run: npm test
